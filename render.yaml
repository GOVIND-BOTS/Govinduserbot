services:
  - type: web
    name: govind-userbot
    plan: free
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: bash start.sh
    repo: https://github.com/GOVIND-BOTS/Govinduserbot
    branch: master
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: OWNER_ID
        sync: false
      - key: SUDO_USERS
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URL
        sync: false
      - key: STRING_SESSION1
        sync: false
    autoDeploy: false
